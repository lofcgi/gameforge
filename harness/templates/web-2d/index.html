<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gameforge web-2d</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { height: 100%; margin: 0; background: #0e0f14; }
      body { overflow: hidden; }
      /* 캔버스의 해상도, 표시 크기, 확대 방식은 src/view.js 의 VIEW 에 따라 main.js 가 정한다. */
      canvas { display: block; }
      /* HUD 글자는 캔버스가 아니라 화면 해상도의 DOM 으로 그린다. 저해상도 캔버스에 쓴 글자는 확대하면 뭉개진다. */
      /* 위치는 main.js 가 물리 픽셀 경계에 맞춰 가운데로 정한다. */
      #stage { position: absolute; }
      #hud { position: absolute; left: 0; top: 0; padding: 0.25em 0.5em; color: #e8eaf0; font: 700 8px ui-monospace, Menlo, monospace; text-shadow: 0 0.12em 0 rgba(0, 0, 0, 0.6); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hud"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
